[project]
name = "hydroflow"
version = "0.1.0"
description = "USGS Water Quality Pipeline"
readme = "README.md"
requires-python = ">=3.12"
# All your dependencies go here in one list
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=1.1.0",
    "dataretrieval>=1.1.4",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "pytest>=9.0.3",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
filterwarnings = [
    "ignore::DeprecationWarning:dataretrieval",
]
